# audit_rules.yaml — v1.1 (context-aware)
# Примечание:
# 1) Новые поля добавлены ТОЛЬКО внутри params: anchor_any, exclude_context, sentence_scope, window_chars, section_scope.
# 2) Если движок их не использует — логика не ломается. Если использует — снижаются FP в блоках санкций.

rules:
  - rule_id: R1_FORM_TEMPLATE
    name: "Форма и шаблон договора"
    description: "Утверждённая форма без изменений. Запрещены: 'по форме контрагента', 'протокол разногласий'."
    applies_to_templates: ["Все"]
    severity: critical
    mode: deny_on_match
    params:
      banned_regex:
        - '(?i)протокол(\s+)?разногласий'
        - '(?i)по\s+форме\s+контрагента'
        - '(?i)не\s+по\s+форме,?\s+утвержд[её]нн?ой'
    triggers:
      - type: regex_any
        patterns:
          - '(?i)протокол(\s+)?разногласий'
          - '(?i)по\s+форме\s+контрагента'
          - '(?i)не\s+по\s+форме,?\s+утвержд[её]нн?ой'
    enabled: true

  - rule_id: R2_TERM_DURATION
    name: "Срок действия договора"
    description: "≤ 3 года, конечная дата. Запрещены 'бессрочно', 'до полного исполнения', автопролонгация."
    applies_to_templates: ["Все"]
    severity: critical
    mode: custom
    params:
      max_years: 3
      banned_regex:
        - "(?i)бессрочн(ый|о)"
        - '(?i)до\s+полного\s+исполнени[яия]'
        - '(?i)авто\s*пролонгац'
      date_regex:
        - '(?i)с\s*(\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}|\d{1,2}\s+[а-яё]+\s+\d{4})\s*г?\.?\s*(?:по|до)\s*(\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}|\d{1,2}\s+[а-яё]+\s+\d{4})'
        - '(?i)действу[её]т\s+до\s*(\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}|\d{1,2}\s+[а-яё]+\s+\d{4})'
    triggers:
      - type: regex_any
        patterns:
          - '(?i)действу[её]т\s+до'
          - '(?i)срок\s+действия'
          - "(?i)бессрочн"
          - "(?i)автопролонгац"
    enabled: true

  - rule_id: R3_PAYMENT_TERM
    name: "Срок оплаты"
    description: "≥ 60 календарных дней (если нет ссылки на закон РФ). Контекстно привязан к разделу оплаты; санкционные фразы игнорируются."
    applies_to_templates: ["Поставка", "Услуги", "Подряд", "Все"]
    severity: critical
    mode: custom
    params:
      min_days: 60

      # Узкие регексы с привязкой к оплате (убирают ложные срабатывания на 'пеню за каждый день'):
      days_regex:
        - '(?i)\bсрок\s+оплаты\b[^.\n]{0,120}?(\d{1,3})\s*(?:\([^)]+\))?\s*(календарн|рабоч|банковск)\w*\s+дн'
        - '(?i)\bоплат[аы]\b[^.\n]{0,120}?\b(?:в\s+течени[ие]|не\s+позднее)\s+(\d{1,3})\s*(?:\([^)]+\))?\s*(календарн|рабоч|банковск)\w*\s+дн'
        - '(?i)\bперечисл\w+\b[^.\n]{0,120}?\b(?:в\s+течени[ие]|не\s+позднее)\s+(\d{1,3})\s*(?:\([^)]+\))?\s*(календарн|рабоч|банковск)\w*\s+дн'

      # Обязательные якоря оплаты в пределах предложения/окна:
      anchor_any:
        - '(?i)\bсрок\s+оплаты\b'
        - '(?i)\bоплат[аы]\b'
        - '(?i)\bперечисл\w+\b'
        - '(?i)\bплат[её]ж\b'

      # Исключающий контекст (санкции/ответственность) — если встречается рядом, правило не срабатывает:
      exclude_context:
        - '(?i)\bштраф\w*'
        - '(?i)\bпен[яе]\b'
        - '(?i)\bнеусто(й|и)к\w*'
        - '(?i)\bсанкц\w*'
        - '(?i)\bпросрочк\w*'
        - '(?i)\bответственност\w*'

      # Исключения стандарта:
      exception_regex:
        - '(?i)в\s+соответствии\s+с\s+законом'
        - '(?i)если\s+иное\s+предписано\s+законом'

      # Рекомендуемые опции движка (безопасны, если игнорируются):
      sentence_scope: true # проверка в границах предложения
      window_chars: 140 # если нет sentence-split — окно близости
      section_scope:
        - "payments" # внутренний код секции "Оплата/Расчёты" (если поддерживается)
        - '(?i)порядок\s+расч(е|ё)тов'
        - "(?i)оплат[аы]"

      # Старые триггеры остаются для совместимости.
      triggers:
        - type: regex_any
          patterns:
            - '(?i)срок\s+оплаты'
            - "(?i)оплат[аы]"
            - "(?i)перечисл"
            # Ранее здесь были общие 'календарн/рабоч дн' — сохранены только якоря оплаты.
    enabled: true

  - rule_id: R4_PREPAYMENT
    name: "Предоплата (аванс)"
    description: "Предоплата допустима только при выполнении условий п. 6.6 (одобрение, аккредитация, БГ и т.д.)."
    applies_to_templates: ["Поставка", "Услуги", "Подряд", "Все"]
    severity: major
    mode: custom
    params:
      prepay_regex:
        - "(?i)предоплат"
        - "(?i)аванс"
        - '(?i)оплата\s+на\s+услови[ях]\s+предоплат'
        - '(?i)100\s*%.*?(?:предоплат|аванс|до\s+начала)'
        - '(?i)(?:предоплат|аванс).*?100\s*%'
        - '(?i)перечисл\w*\s+.*?до\s+начала\s+(?:оказания|выполнения|поставки)'
        - '(?i)платеж\s+в\s+размере\s+100'
      condition_regex:
        - '(?i)п\.\s*6\.6'
        - '(?i)при\s+соблюдени[ея]\s+условий'
        - '(?i)банковск[а-я]+\s+гарант'
        - '(?i)одобрени[ея]\s+в\s+соответствии\s+с\s+положени[еем]\s+о\s+полномоч'
        - "(?i)аккредитац"
      # Контекстные якоря оплаты (для устойчивости):
      anchor_any:
        - '(?i)\bоплат[аы]\b'
        - '(?i)\bперечисл\w+\b'
      exclude_context: [] # умышленно пусто
      sentence_scope: true
      window_chars: 140
    triggers:
      - type: regex_any
        patterns:
          - "(?i)предоплат"
          - "(?i)аванс"
    enabled: true

  - rule_id: R5_ACCEPTANCE_TERM
    name: "Срок приёмки работ/услуг"
    description: "Не менее 5 рабочих дней при наличии работ/услуг. Контекстно привязан к приёмке; санкционные фразы игнорируются."
    applies_to_templates: ["Услуги", "Подряд", "Все"]
    severity: major
    mode: custom
    params:
      min_workdays: 5

      # Узкие регексы с привязкой к приёмке:
      days_regex:
        - '(?i)\b(при[её]мк[аи]|акт[а-я ]+при[её]м[ки])\b[^.\n]{0,120}?\b(?:в\s+течени[ие]|не\s+позднее|срок)\s+(\d{1,3})\s*(?:\([^)]+\))?\s*(рабоч|календар)\w*\s+дн'
        - '(?i)\bпринять\b[^.\n]{0,120}?\b(?:работ[ыа]|услуг[и])\b[^.\n]{0,120}?\b(?:в\s+течени[ие]|не\s+позднее)\s+(\d{1,3})\s*(?:\([^)]+\))?\s*(рабоч|календар)\w*\s+дн'

      # Якоря приёмки:
      anchor_any:
        - '(?i)\bпри[её]мк'
        - '(?i)\bакт[а-я ]+при[её]м'
        - '(?i)\bпринять\s+(?:работ[ыа]|услуг[и])'

      # Исключающий контекст — «штраф/пеня/неустойка/просрочка/ответственность»:
      exclude_context:
        - '(?i)\bштраф\w*'
        - '(?i)\bпен[яе]\b'
        - '(?i)\bнеусто(й|и)к\w*'
        - '(?i)\bсанкц\w*'
        - '(?i)\bпросрочк\w*'
        - '(?i)\bответственност\w*'

      # Рекомендуемый скоуп:
      sentence_scope: true
      window_chars: 140
      section_scope:
        - "acceptance"
        - '(?i)порядок\s+при[её]мки'
        - "(?i)при[её]мк[аи]"

      # Маркеры предмета:
      subject_markers:
        - "(?i)работ[ыа]"
        - "(?i)услуг[и]"

    triggers:
      - type: regex_any
        patterns:
          - '(?i)срок\s+при[её]мк'
          - '(?i)акт\s+при[её]мк'
          - "(?i)при[её]мк"
    enabled: true

  - rule_id: R6_PAYMENT_DAY
    name: "Платёжный день"
    description: "Один платёжный день в неделю; иная периодичность — нестандартно."
    applies_to_templates: ["Все"]
    severity: major
    mode: custom
    params:
      weekly_regex:
        - '(?i)плат[её]жн[ыий]\s+день\s+\w+\s+кажд[уюые]\s+недел[юи]'
        - '(?i)оплата\s+осуществляется\s+\w+\s+еженедел'
        - '(?i)один\s+плат[её]жн[ыий]\s+день\s+в\s+недел[юи]'
        - '(?i)плат[её]ж[иы]\s+.*?\s+четверг'
        - '(?i)плат[её]ж[иы]\s+.*?\s+понедельник'
        - '(?i)плат[её]ж[иы]\s+.*?\s+вторник'
        - '(?i)плат[её]ж[иы]\s+.*?\s+сред[ау]'
        - '(?i)плат[её]ж[иы]\s+.*?\s+пятниц[ау]'
      non_weekly_ban_regex:
        - '(?i)\bплат[её]ж\w*\s+.*?\s+ежедневн'
        - '(?i)\bплат[её]ж\w*\s+.*?\s+ежемесячн'
        - '(?i)\bплат[её]ж\w*\s+.*?\s+каждый\s+день'
        - '(?i)\bоплат[аы]\s+.*?\s+ежедневн'
        - '(?i)\bоплат[аы]\s+.*?\s+каждый\s+(?:рабоч[ийе]+\s+)?день'
        - '(?i)плат[её]ж[иы]\s+.*?\s+кажд[ыий]+\s+рабоч[ийе]+\s+день'
        - '(?i)\bплатежи\s+осуществляются\s+ежедневно'

      # Обязательные якоря платежей/расчетов:
      anchor_any:
        - '(?i)\bплат[её]ж'
        - '(?i)\bоплат[аы]'
        - '(?i)\bрасч[её]т'
        - '(?i)\bперечислени[ея]'

      # Исключающий контекст — санкции/ответственность (если встречается, правило НЕ срабатывает):
      exclude_context:
        - '(?i)\bштраф\w*'
        - '(?i)\bпен[яюе]\b'
        - '(?i)\bнеусто[йи]к\w*'
        - '(?i)\bсанкц\w*'
        - '(?i)\bпросрочк\w*'
        - '(?i)\bответственност\w*'
        - '(?i)\bнарушени[ея]'
        - '(?i)за\s+каждый\s+день\s+просрочки'

      # Рекомендуемый скоуп:
      sentence_scope: true
      window_chars: 140
      section_scope:
        - "payments"
        - '(?i)порядок\s+расч(е|ё)тов'
        - "(?i)оплат[аы]"
    triggers:
      - type: regex_any
        patterns:
          - "(?i)плат[её]ж"
          - "(?i)(?:платеж|оплат).*ежедневн"
          - '(?i)(?:платеж|оплат).*каждый\s+день'
          - '(?i)порядок\s+расч[её]тов'
    enabled: true

  - rule_id: R7_ALLOWED_CHANGES_IN_CONTRACT
    name: "Допустимые изменения в договоре"
    description: "Разрешены только указанные в стандарте изменения; прочие базовые условия менять нельзя."
    applies_to_templates: ["Все"]
    severity: major
    mode: custom
    params:
      banned_keywords:
        - '(?i)изменение\s+порядка\s+подсудности'
        - '(?i)односторонн[а-я]+\s+изменени[ея]\s+цены'
        - '(?i)исключительн[а-я]+\s+права\s+поставщика'
      # Контекстные исключения на санкции не требуются
    triggers:
      - type: regex_any
        patterns:
          - "(?i)изменени[ея]"
          - "(?i)гарантийн"
          - "(?i)ответственност[ьи]"
    enabled: true

  - rule_id: R8_ALLOWED_CHANGES_IN_ADDENDA
    name: "Допустимые изменения в допсоглашении"
    description: "Должны соответствовать допустимому перечню; выход за пределы перечня — нарушение."
    applies_to_templates: ["Все"]
    severity: major
    mode: custom
    params:
      allowed_keywords:
        - "(?i)лимит"
        - '(?i)срок\s+действия'
        - "(?i)предоплат|аванс"
        - '(?i)срок[и]?\s+поставк|оказани[яе]\s+услуг|выполнени[ея]\s+работ'
        - "(?i)реквизит[ыов]"
        - "(?i)ответственност[ьи]"
      ban_if_contains:
        - '(?i)изменение\s+предмета\s+договора\s+в\s+существенной\s+части'
    triggers:
      - type: regex_any
        patterns:
          - '(?i)доп(?:олнительн\w*)?\s*соглашени[ея]'
    enabled: true

  - rule_id: R9_SPEC_APP_TZ
    name: "Стандартная спецификация/приложение/ТЗ"
    description: "Спеки/приложения/ТЗ конкретизируют условия и не вводят новые."
    applies_to_templates: ["Все"]
    severity: minor
    mode: custom
    params:
      must_have_any:
        - "(?i)предмет"
        - "(?i)цен[аы]"
        - '(?i)срок[и]?\s+поставк|оказани[яе]\s+услуг|выполнени[ея]\s+работ'
        - '(?i)порядок\s+исполнени[яе]'
        - '(?i)услови[яе]\s+доставк|оказани[яе]\s+услуг'
        - "(?i)гарантийн[а-я]+"
      ban_new_terms_regex:
        - '(?i)условия,?\s+не\s+предусмотренн[а-я]+'
      # Скоуп по разделам здесь не критичен
    triggers:
      - type: regex_any
        patterns:
          - '(?i)спецификац|приложени[ея]|технич[её]ск[оеая]\s+задани[ея]'
    enabled: true

  - rule_id: R10_FRAME_CONTRACT
    name: "Рамочный договор"
    description: "Для рамочных договоров должны быть описаны природа отношений и лимиты/объемы."
    applies_to_templates: ["Рамочный", "Все"]
    severity: minor
    mode: custom
    params:
      frame_markers:
        - "(?i)рамочн[а-я]+"
      must_have_any:
        - '(?i)лимит|максимальн[а-я]+\s+об[ъь]ем'
      # Допустимо расширить section_scope при появлении секций «Общие положения»
    triggers:
      - type: regex_any
        patterns:
          - "(?i)рамочн"
          - "(?i)лимит"
    enabled: true
